name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          mkdir -p release
          cd dist
          zip -r ../release/last-session-${{ github.ref_name }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Last Session ${{ github.ref_name }}
          body: |
            ## Last Session ${{ github.ref_name }}

            ### 安裝方式
            1. 下載 `last-session-${{ github.ref_name }}.zip`
            2. 解壓縮到一個資料夾
            3. 開啟 Chrome → `chrome://extensions`
            4. 開啟「開發人員模式」
            5. 點選「載入未封裝項目」並選取解壓縮的資料夾
          files: release/last-session-${{ github.ref_name }}.zip
