<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title></title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 id="title" class="header-title"></h1>
      <div class="header-actions">
        <span id="remove-selected" class="btn-small"></span>
        <span id="open-selected" class="btn-small"></span>
          <div class="optimize-dropdown" id="optimize-dropdown">
          <span id="ai-optimize" class="btn-small"></span>
          <div class="optimize-submenu" id="optimize-submenu">
            <div class="optimize-mode" data-mode="purge-removed"></div>
            <div class="optimize-divider"></div>
            <div class="optimize-mode" data-mode="exact-match"></div>
            <div class="optimize-mode" data-mode="ignore-query"></div>
            <div class="optimize-mode" data-mode="domain-path"></div>
          </div>
        </div>
        <span id="sync-now" class="btn-small" style="display: none;"></span>
        <span id="theme-toggle" class="btn-small"></span>
        <span id="open-options" class="btn-small">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43-.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V2h-.44a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
    </header>
    <main class="app-main">
      <div class="content-container">
        <div class="popup-main-container">
          <div class="left-column" id="left-column">
            <!-- Pinned and Group sections -->
          </div>
          <div class="right-column" id="right-column">
            <!-- 全局搜尋欄：對所有會話及其分頁進行跨會話搜尋 -->
            <div class="global-search-container">
              <input type="text" id="global-search" class="global-search-input">
            </div>
            <div id="general-sections-container">
              <!-- General section -->
            </div>
          </div>
        </div>
      </div>

    </main>
    <footer class="app-footer">
      <div class="content-container">
        <div class="footer-content">
          <span id="footer-info">
            <strong>v1.0</strong> · <a href="https://github.com/ainlee/Last-Session-PLUS" target="_blank">GitHub</a>
          </span>
          <div id="sync-indicator" style="display: none; font-size: 10px; color: #999; pointer-events: none;"></div>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
