<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title id="pageTitle"></title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 id="optionsTitle" class="header-title"></h1>
      <div class="header-actions">
        <span id="theme-toggle" class="btn-small"></span>
        <span id="open-options" class="btn-small">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43-.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V2h-.44a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
    </header>
    
    <main class="app-main">
      <div class="content-container">
        <form class="form">
          <!-- 一般設定 -->
          <section class="settings-group">
            <h2 id="generalSettingsTitle" class="group-title"></h2>
            
            <div class="form-item">
              <div class="form-item-label"><span id="urlLabel"></span><span id="urlLabelSuffix"></span></div>
              <div class="form-item-content">
                <div id="url"></div>
                <button type="button" id="copyUrlBtn" class="btn-small"></button>
              </div>
            </div>
    
            <div class="startup-guide">
              <div id="guideTitle" class="guide-title"></div>
              <div class="guide-steps">
                <div id="guideStep1" class="guide-step"></div>
                <div id="guideStep2" class="guide-step"></div>
                <div id="guideStep3" class="guide-step"></div>
              </div>
            </div>
    
            <div class="form-item">
              <div id="themeLabel" class="form-item-label"></div>
              <div class="form-item-content">
                <div class="custom-picker" id="theme-picker">
                  <div class="picker-trigger"></div>
                  <ul class="picker-options" style="display: none;"></ul>
                  <select id="theme" aria-labelledby="themeLabel" style="display: none;"></select>
                </div>
              </div>
            </div>
    
            <div class="form-item">
              <div id="funcTypeLabel" class="form-item-label"></div>
              <div class="form-item-content">
                <div class="custom-picker" id="funcType-picker">
                  <div class="picker-trigger"></div>
                  <ul class="picker-options" style="display: none;"></ul>
                  <select id="funcType" aria-labelledby="funcTypeLabel" style="display: none;"></select>
                </div>
              </div>
            </div>
    
            <div class="form-item">
              <div id="recentSizeLabel" class="form-item-label"></div>
              <div class="form-item-content">
                <input type="number" id="recentSize" aria-labelledby="recentSizeLabel">
              </div>
            </div>
    
            <div class="form-item">
              <button type="button" id="clearData" class="btn-danger"></button>
            </div>
          </section>
    
          <!-- AI 配置 (封存) -->
          <section class="settings-group" style="display: none;">
            <h2 id="aiConfigTitle" class="group-title"></h2>
            <div class="form-item">
              <div id="aiBaseUrlLabel" class="form-item-label"></div>
              <div class="form-item-content">
                <input type="text" id="aiBaseUrl">
              </div>
            </div>
            <div class="form-item">
              <div id="aiApiKeyLabel" class="form-item-label"></div>
              <div class="form-item-content">
                <input type="password" id="aiApiKey">
              </div>
            </div>
            <div class="form-item">
              <div id="aiModelLabel" class="form-item-label"></div>
              <div class="form-item-content flex-row">
                <div class="custom-picker" id="aiModel-picker">
                  <div class="picker-trigger"></div>
                  <ul class="picker-options" style="display: none;"></ul>
                  <select id="aiModel" style="display: none;"></select>
                </div>
                <button type="button" id="updateModelsBtn" class="btn-small"></button>
              </div>
            </div>
          </section>
    
          <!-- 雲端同步 (封存) -->
          <section class="settings-group" style="display: none;">
            <h2 id="cloudSyncTitle" class="group-title"></h2>
            <div class="form-item">
              <div id="syncProviderLabel" class="form-item-label"></div>
              <div class="form-item-content">
                <div class="custom-picker" id="syncProvider-picker">
                  <div class="picker-trigger"></div>
                  <ul class="picker-options" style="display: none;"></ul>
                  <select id="syncProvider" aria-labelledby="syncProviderLabel" style="display: none;">
                    <option value="google">Google Drive</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="form-item">
              <div id="syncEnabledLabel" class="form-item-label"></div>
              <div class="form-item-content">
                <input type="checkbox" id="syncEnabled" aria-labelledby="syncEnabledLabel">
              </div>
            </div>
            <div class="form-item flex-row">
              <button type="button" id="syncLogin" class="btn"></button>
              <button type="button" id="syncLogout" class="btn"></button>
            </div>
            <div class="form-item">
              <div id="syncStatus" class="sync-status"></div>
            </div>
          </section>
        </form>
      </div>
    </main>
    
    <footer class="app-footer">
      <div class="content-container">
        <details id="diagLogContainer">
          <div class="diag-header">
            <summary id="diagLogSummary"></summary>
            <span id="logToggle" class="log-toggle" role="switch" tabindex="0"></span>
          </div>
          <div class="log-viewer-container">
            <div class="log-viewer-actions">
              <button type="button" id="copyLogsBtn" class="btn-small"></button>
              <button type="button" id="clearLogsBtn" class="btn-small btn-danger"></button>
            </div>
            <pre id="systemLogs" class="log-viewer-content"></pre>
          </div>
        </details>
      </div>
    </footer>
  </div>
</body>
</html>
